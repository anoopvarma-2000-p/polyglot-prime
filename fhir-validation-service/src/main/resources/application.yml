org:
  techbd:
    version: ${project.version}
    udi:
      prime:
        jdbc:
          # JDBC connection settings for the UDI Prime database
          # The environment variable ${SPRING_PROFILES_ACTIVE} should be set to the active profile (e.g., dev, qa, prod)
          # This allows for different configurations based on the active profile
          # Example: If SPRING_PROFILES_ACTIVE=dev, then the property will resolve to dev_TECHBD_UDI_DS_PRIME_JDBC_URL
          url: ${${SPRING_PROFILES_ACTIVE}_TECHBD_UDI_DS_PRIME_JDBC_URL:}
          jdbcUrl: ${${SPRING_PROFILES_ACTIVE}_TECHBD_UDI_DS_PRIME_JDBC_URL:}
          username: ${${SPRING_PROFILES_ACTIVE}_TECHBD_UDI_DS_PRIME_JDBC_USERNAME:}
          password: ${${SPRING_PROFILES_ACTIVE}_TECHBD_UDI_DS_PRIME_JDBC_PASSWORD:}
          driverClassName: org.postgresql.Driver
          maximumPoolSize: 10   # The maximum number of database connections HikariCP can open simultaneously. 
                      # For Aurora instances, a common guideline is: vCPUs × 2 + a small overhead 
                      # (e.g., for a 2-vCPU Aurora instance → recommended range is ~8–10).
          minimumIdle: 5                # Minimum number of idle connections kept ready (half of maxPoolSize)
          idleTimeout: 60000            # 1 minute – aggressively removes idle connections to avoid unnecessary DB load
          connectionTimeout: 20000      # 20 seconds to wait for a connection from the pool before timing out
          maxLifetime: 1800000          # 30 minutes – maximum lifetime before a connection is replaced (safe for Aurora)
    ig-packages:
      fhir-v4:
        shinny-packages:
        # Any new version of shinny should follow the naming convention: shinny-v<version> in kebab-case
        # Example: shinny-v1-2-3 for version 1.2.3
        # Any new version for test-shinny should follow the naming convention: test-shinny-v<version> in kebab-case
        # Example: test-shinny-v1-3-0 for version 1.3.0
          test-shinny-v2-0-0:
            profile-base-url: http://test.shinny.org/us/ny/hrsn
            package-path: ig-packages/shin-ny-ig/test-shinny/v2.0.0
            # NOTE: When updating this IG version:
            # 1. Update BaseIgValidationTest.getIgPackages()
            # 2. Download latest examples to fhir-validation-service/src/test/resources/org/techbd/ig-examples/test-shinny-examples
            # 3. Verify OrchestrationEngineTest and IgPublicationIssuesTest pass
            ig-version: 2.0.0
          shinny-v1-9-4:
            profile-base-url: http://shinny.org/us/ny/hrsn
            package-path: ig-packages/shin-ny-ig/shinny/v1.9.4
            # NOTE: When updating this IG version:
            # 1. Update BaseIgValidationTest.getIgPackages()
            # 2. Download latest examples to fhir-validation-service/src/test/resources/org/techbd/ig-examples/shinny-examples
            # 3. Verify OrchestrationEngineTest and IgPublicationIssuesTest pass
            ig-version: 1.9.4
        base-packages:
        # Base packages for external dependencies 
          us-core: ig-packages/fhir-v4/us-core/stu-7.0.0
          sdoh: ig-packages/fhir-v4/sdoh-clinicalcare/stu-2.3.0
          uv-sdc: ig-packages/fhir-v4/uv-sdc/stu-3.0.0
          extensions: ig-packages/fhir-v4/uv-extensions/5.2.0
    fhir:
      validator:
        # Validators for the shinny-packages above are built at startup and never evicted.
        # Requests whose IG version header names another bundled version get a "dynamic" validator
        # (~0.7 GB heap and ~14 s to build each). These settings bound them:
        #   max-dynamic: how many dynamic validators may be kept at once (0 = never build them;
        #                such requests fall back to matching the bundle's meta.profile URL)
        #   dynamic-ttl: a dynamic validator unused for this long is evicted, even with no traffic
        max-dynamic: ${TECHBD_FHIR_VALIDATOR_MAX_DYNAMIC:2}
        dynamic-ttl: ${TECHBD_FHIR_VALIDATOR_DYNAMIC_TTL:30m}
        # true: validate SNOMED, ICD-10-CM, LOINC, CPT, HCPCS and BCP-47 codes by lookup in shared code sets
        #       (ReferenceTerminologyValidationSupport) instead of enumerating ~530k codes into every validator.
        #       Much less heap and a faster first validation; same validation results. Applied at startup.
        # false: enumerated terminology (previous behaviour).
        lookup-terminology: ${TECHBD_FHIR_VALIDATOR_LOOKUP_TERMINOLOGY:false}
    baseFHIRURL: ${TECHBD_BASE_FHIR_URL} #This is the default FHIR url used in generating FHIR from CSV
    validation-severity-level: error  # Possible values: fatal, error, warning, information
    structureDefinitionsUrls:
      bundle: /StructureDefinition/SHINNYBundleProfile
      patient: /StructureDefinition/shinny-patient
      consent: /StructureDefinition/shinny-Consent
      encounter: /StructureDefinition/shinny-encounter
      organization: /StructureDefinition/shin-ny-organization
      observation: /StructureDefinition/shinny-observation-screening-response
      questionnaire: /StructureDefinition/shinny-questionnaire
      practitioner: /StructureDefinition/shin-ny-practitioner
      questionnaireResponse: /StructureDefinition/shinny-questionnaire
      observationSexualOrientation: /StructureDefinition/shinny-observation-sexual-orientation
      procedure: /StructureDefinition/shinny-sdoh-procedure
    operationOutcomeHelpUrl: "https://techbd.org/get-help/"
    dataLedgerApiUrl: ${TECHBD_DATA_LEDGER_API_URL}
    dataLedgerApiKeySecretName: techbd-nyec-dataledger-api-key
    dataLedgerTracking: ${TECHBD_DATA_LEDGER_TRACKING_ENABLED:false}
    dataLedgerDiagnostics: ${TECHBD_DATA_LEDGER_DIAGNOSTICS_ENABLED:true}